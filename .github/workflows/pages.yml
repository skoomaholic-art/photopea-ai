name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check worker/ai-worker.js
          node --check worker/image-sources.js
          node --check asset-manager.js
          node --check image-filters.js
          node --check filter-studio.js
          node --check source-browser.js
          node --check photopea-bridge.js
          node --check poster-app.js
          node --check train-editor.js

      - name: Static smoke check
        run: node scripts/static-smoke.mjs

      - name: Feature contract
        run: node scripts/feature-contract.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
