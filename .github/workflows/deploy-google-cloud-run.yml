name: Deploy Poster Editor to Google Cloud Run (manual)

# First deploy on a specifically named merge commit. Subsequent deploys stay manual/gated.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: poster-editor-gcp
  cancel-in-progress: false

jobs:
  deploy:
    # One-time initial deploy via the precisely named merge commit. Later deploys require owner-controlled flag.
    if: ${{ ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Deploy Poster Editor to Google Cloud Run')) || (github.event_name == 'workflow_dispatch' && vars.GCP_DEPLOY_ENABLED == 'true')) && vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy existing UI and same-origin API
        id: deploy
        run: |
          gcloud run deploy poster-editor \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION || 'me-central1' }}" \
            --source=. \
            --service-account="poster-editor-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --build-service-account="projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/poster-editor-builder@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --no-invoker-iam-check \
            --ingress=all \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --cpu-throttling \
            --set-env-vars=AI_REQUESTS_ENABLED=false \
            --quiet
          URL=$(gcloud run services describe poster-editor \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION || 'me-central1' }}" \
            --format='value(status.url)')
          test -n "$URL"
          echo "Deployed URL: $URL"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$URL/api/status" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              curl -fsS -o /dev/null --max-time 15 "$URL/"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Verified: homepage 200 and API ok=true"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cloud Run did not return healthy /api/status"
          exit 1

      - name: Post verified Cloud Run URL
        if: ${{ steps.deploy.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.DEPLOYED_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 16,
              body: '✅ Poster Editor 3.0 deployed to the existing Google Cloud Run service. Homepage and /api/status returned 200.\n\nURL: ' + url + '\nCommit: ' + context.sha
            });
