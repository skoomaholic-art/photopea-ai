name: Deploy Poster Editor to Google Cloud Run (manual)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: poster-editor-gcp
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Deploy Poster Editor to Google Cloud Run')) || (github.event_name == 'workflow_dispatch' && vars.GCP_DEPLOY_ENABLED == 'true')) && vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      TMDB_TOKEN_GH: ${{ secrets.TMDB_TOKEN }}
      TMDB_READ_ACCESS_TOKEN_GH: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      FANART_API_KEY_GH: ${{ secrets.FANART_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure persistent server library bucket
        run: |
          set -euo pipefail
          BUCKET="${PROJECT_ID}-poster-editor-library"
          RUNTIME_SA="poster-editor-runtime@${PROJECT_ID}.iam.gserviceaccount.com"
          if ! gcloud storage buckets describe "gs://${BUCKET}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${BUCKET}" --project="${PROJECT_ID}" --location="${REGION}" --uniform-bucket-level-access
          fi
          if ! gcloud storage buckets add-iam-policy-binding "gs://${BUCKET}" --member="serviceAccount:${RUNTIME_SA}" --role="roles/storage.objectAdmin" --quiet; then
            echo "Bucket-level IAM is unavailable to deployer. Trying project-level object access."
            gcloud projects add-iam-policy-binding "${PROJECT_ID}" --member="serviceAccount:${RUNTIME_SA}" --role="roles/storage.objectAdmin" --condition=None --quiet
          fi
          echo "LIBRARY_BUCKET=${BUCKET}" >> "$GITHUB_ENV"

      - name: Deploy existing UI and same-origin API
        id: deploy
        run: |
          set -euo pipefail
          ENV_VARS="AI_REQUESTS_ENABLED=false,LIBRARY_BUCKET=${LIBRARY_BUCKET}"
          if [ -n "${TMDB_TOKEN_GH}" ]; then
            ENV_VARS="${ENV_VARS},TMDB_TOKEN=${TMDB_TOKEN_GH}"
          elif [ -n "${TMDB_READ_ACCESS_TOKEN_GH}" ]; then
            ENV_VARS="${ENV_VARS},TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN_GH}"
          fi
          if [ -n "${FANART_API_KEY_GH}" ]; then
            ENV_VARS="${ENV_VARS},FANART_API_KEY=${FANART_API_KEY_GH}"
          fi

          gcloud run deploy poster-editor --project="${PROJECT_ID}" --region="${REGION}" --source=. --service-account="poster-editor-runtime@${PROJECT_ID}.iam.gserviceaccount.com" --build-service-account="projects/${PROJECT_ID}/serviceAccounts/poster-editor-builder@${PROJECT_ID}.iam.gserviceaccount.com" --no-invoker-iam-check --ingress=all --min-instances=0 --max-instances=1 --cpu=1 --memory=512Mi --concurrency=80 --cpu-throttling --update-env-vars="${ENV_VARS}" --quiet

          URL=$(gcloud run services describe poster-editor --project="${PROJECT_ID}" --region="${REGION}" --format='value(status.url)')
          test -n "$URL"
          echo "Deployed URL: $URL"

          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -fsS --max-time 15 "$URL/api/status" || true)
            if printf '%s' "$STATUS" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' && printf '%s' "$STATUS" | grep -Eq '"library"[[:space:]]*:[[:space:]]*\{[[:space:]]*"server"[[:space:]]*:[[:space:]]*true'; then
              curl -fsS -o /dev/null --max-time 15 "$URL/"
              PROBE_KEY="deploy-check-${GITHUB_RUN_ID}-${GITHUB_SHA}"
              PROBE_ID="probe-${GITHUB_RUN_ID}"
              curl -fsS --max-time 20 -X POST "$URL/api/library/works" -H "Content-Type: application/json" -H "X-Library-Key: ${PROBE_KEY}" --data "{\"archiveId\":\"${PROBE_ID}\",\"workspace\":\"vertical\",\"title\":\"deployment probe\",\"createdAt\":0,\"updatedAt\":0}" >/dev/null
              curl -fsS --max-time 20 "$URL/api/library/works/${PROBE_ID}" -H "X-Library-Key: ${PROBE_KEY}" | grep -q "${PROBE_ID}"
              curl -fsS --max-time 20 -X DELETE "$URL/api/library/works/${PROBE_ID}" -H "X-Library-Key: ${PROBE_KEY}" >/dev/null
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Verified: homepage 200, API ok=true, server library read/write=true"
              {
                echo "### Poster Editor Cloud Run release"
                echo ""
                echo "Live UI and server library read/write confirmed"
                echo "URL: $URL"
                echo "Commit: $GITHUB_SHA"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Cloud Run did not return healthy API with writable server library"
          exit 1
