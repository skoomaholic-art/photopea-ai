name: Browser Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax checks
        run: |
          node --check worker/ai-worker.js
          node --check worker/image-sources.js
          node --check asset-manager.js
          node --check image-filters.js
          node --check filter-studio.js
          node --check source-browser.js
          node --check photopea-bridge.js
          node --check poster-app.js
          node --check train-editor.js
          node --check top10-editor.js
          node --check workspace-tools.js
          node --check range-number-sync.js
          node --check zip-store.js

      - name: Static smoke
        run: |
          npm ci
          npm run build:vendor
          npm run check:syntax
          npm run smoke
          npm run test:unit
          npm run build:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:e2e

      - name: Run real Photopea layered integration
        id: photopea_live
        continue-on-error: true
        env:
          REAL_PHOTOPEA: "1"
        run: npx playwright test tests/photopea-real.spec.mjs --workers=1 --retries=1

      - name: Run real local background removal
        id: background_live
        continue-on-error: true
        env:
          REAL_BACKGROUND: "1"
        run: npx playwright test tests/local-background.integration.spec.mjs --workers=1 --retries=0

      - name: Report local model result
        if: always() && steps.background_live.outcome == 'failure'
        run: |
          echo "::warning::Local ML integration failed; real background removal is not verified."
          echo "### Local ML: NOT VERIFIED" >> "$GITHUB_STEP_SUMMARY"

      - name: Report live Photopea result
        if: always() && steps.photopea_live.outcome == 'failure'
        run: |
          echo "::warning::Real Photopea integration failed. Mock browser tests do not verify the live editor."
          echo "### Live Photopea: NOT VERIFIED" >> "$GITHUB_STEP_SUMMARY"
          echo "The live integration failed. See the Playwright report; do not treat the green mock suite as live verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report on failure
        if: failure() || steps.photopea_live.outcome == 'failure' || steps.background_live.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
