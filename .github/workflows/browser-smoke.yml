name: Browser Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax checks
        run: |
          node --check worker/ai-worker.js
          node --check worker/image-sources.js
          node --check asset-manager.js
          node --check image-filters.js
          node --check filter-studio.js
          node --check source-browser.js
          node --check photopea-bridge.js
          node --check poster-app.js
          node --check train-editor.js
          node --check top10-editor.js
          node --check workspace-tools.js
          node --check range-number-sync.js
          node --check zip-store.js

      - name: Static smoke
        run: |
          npm ci
          npm run build:vendor
          npm run check:syntax
          npm run smoke
          npm run test:unit
          npm run build:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-report
          path: playwright-report

  live-integrations:
    name: Live ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Photopea
            test: tests/photopea-real.spec.mjs
          - name: Local-ML
            test: tests/local-background.integration.spec.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build:vendor
      - run: npx playwright install --with-deps chromium
      - name: Verify real integration without paid AI
        env:
          REAL_PHOTOPEA: ${{ matrix.name == 'Photopea' && '1' || '' }}
          REAL_BACKGROUND: ${{ matrix.name == 'Local-ML' && '1' || '' }}
          AI_REQUESTS_ENABLED: "false"
        run: npx playwright test ${{ matrix.test }} --workers=1 --retries=0
      - name: Record failed verification
        if: failure()
        run: |
          echo "::error::Live ${{ matrix.name }} is NOT VERIFIED. Mock tests do not prove availability of this service."
          echo "### Live ${{ matrix.name }}: NOT VERIFIED" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-live-${{ matrix.name }}
          path: playwright-report
